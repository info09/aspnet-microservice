version: '3.8'

services:
  identityDb:
   image: mcr.microsoft.com/mssql/server:2019-latest
   container_name: identityDb
   ports: 
    - "1436:1433"
   environment:
    SA_PASSWORD: "Passw0rd!"  
    ACCEPT_EULA: "Y"
   volumes:
    - tedu_identity_sqlserver_data:/var/opt/mssql
   restart: always

volumes:
  tedu_identity_sqlserver_data:
   external: false